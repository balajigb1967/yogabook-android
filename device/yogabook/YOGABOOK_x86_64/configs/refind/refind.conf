# rEFInd configuration - Lenovo Yoga Book (portrait 1200x1920 touchscreen)
# Generated for the YOGABOOK live ISO. No keyboard required: tap icons.

timeout 20
use_graphics_mode true
scanfor manual,external,firmware

# Touch: taps activate the highlighted/default entry on firmware that
# exposes a pointer to EFI. Big icons + generous timeout for fingers.
enable_touch true
big_icon_size 192
resolution max
hideui hints,singleuser,badges
banner_scale fillscreen

showtools reboot,shutdown,fwsetup

# Icons live next to this file (icons/ copied from the rEFInd distribution)
# @TOKENS@ below are substituted by scripts/make-refind-iso.sh with the
# actual kernel/ramdisk paths and kernel command lines.
