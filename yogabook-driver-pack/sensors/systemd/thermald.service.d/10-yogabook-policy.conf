[Unit]
After=systemd-modules-load.service
StartLimitIntervalSec=180s
StartLimitBurst=6

[Service]
ExecStartPre=/usr/libexec/yogabook-sensors/generate-thermald-config.sh
ExecStart=
ExecStart=/usr/sbin/thermald --systemd --dbus-enable --ignore-default-control --config-file=/run/thermald/yogabook-thermal-conf.xml --poll-interval=4
RestartSec=10s
TimeoutStartSec=70s
