SectionVerb {
	Include.e.File "EnableSeq.conf"

	# The legacy SST topology exposes the large Bay Trail media-mixer
	# control graph. SOF topologies do not, so only apply these platform
	# sequences when an SST-only control proves that graph is present.
	If.Controls {
		Condition {
			Type ControlExists
			Control "name='media0_in Gain 0 Switch'"
		}
		Before.EnableSequence "0"
		True {
			Include.pe.File "/platforms/bytcr/PlatformEnableSeq.conf"
			Include.pd.File "/platforms/bytcr/PlatformDisableSeq.conf"
		}
	}
}

Include.spk.File "Speaker.conf"
Include.hp.File "HeadsetPhones.conf"

Include.dmic.File "DMIC1.conf"
Include.hsmic.File "HeadsetMic.conf"
