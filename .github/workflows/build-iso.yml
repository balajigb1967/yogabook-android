# Builds the Lenovo Yoga Book Android Live ISO directly on GitHub-hosted runners.
# No self-hosted runner or local high-spec PC needed.
#
# Hardware target: Lenovo Yoga Book (YB1-X90F / YB1-X91F / YB1-X91L)
# Features:
#   - Linux 6.x kernel with Maurizio Casciano's Yoga Book patchset (ASoC cht_rt5677)
#   - Sound Open Firmware (SOF v2.15.1) RT5677 topology
#   - Halo Keyboard daemon (touch_keyboard_handler) + uinput & haptics
#   - rEFInd touch-friendly UEFI bootloader + hybrid GRUB BIOS fallback
#   - Native portrait display orientation fix (ORIENTATION_90)

name: build-iso

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: "Base Android x86 ISO download URL (optional)"
        type: string
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "*.png"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on GitHub Runner
        run: |
          echo "=== Initial disk space ==="
          df -h /
          echo "Cleaning preinstalled bloat (Android SDK, .NET, GHC, Docker, Boost, vcpkg)..."
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/local/share/boost \
            /usr/share/swift \
            /var/lib/docker
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            xorriso mtools grub-pc-bin grub-efi-amd64-bin \
            p7zip-full squashfs-tools curl unzip rsync git

      - name: Build Yoga Book Android ISO
        env:
          BASE_ROM_URL: ${{ inputs.base_rom_url }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-github.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-android-live-iso
          path: |
            dist/*.iso
            dist/*.sha256
          if-no-files-found: error

      - name: Draft GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="iso-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" dist/*.iso dist/*.sha256 --draft \
            --title "Yoga Book Android Live ISO ($tag)" \
            --notes "Automated Lenovo Yoga Book (YB1-X90F/X91F/X91L) Live ISO built with GitHub Actions.
            - Kernel: Linux 6.x (Yoga-Book-Linux-Kernel submission/yogabook-x91l-v2)
            - Audio: ASoC CHT-RT5677 + SOF v2.15.1
            - Input: Goodix Halo Keyboard handler + DRV2604 haptics
            - Boot: rEFInd touch-enabled boot menu
            - Display: Native portrait orientation quirk"
