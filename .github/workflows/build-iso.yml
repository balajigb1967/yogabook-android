# Builds the Lenovo Yoga Book Android Live ISO directly on GitHub-hosted runners.
# No self-hosted runner or local high-spec PC needed.
#
# Hardware target: Lenovo Yoga Book (YB1-X90F / YB1-X91F / YB1-X91L)
# Features:
#   - Linux 6.x kernel with Maurizio Casciano's Yoga Book patchset (ASoC cht_rt5677)
#   - Sound Open Firmware (SOF v2.15.1) RT5677 topology
#   - Halo Keyboard daemon (touch_keyboard_handler) + uinput & haptics
#   - rEFInd touch-friendly UEFI bootloader + hybrid GRUB BIOS fallback
#   - Native portrait display orientation fix (ORIENTATION_90)

name: build-iso

on:
  workflow_dispatch:
    inputs:
      lineage_gsi_url:
        description: "Custom LineageOS 23.2 GSI URL (optional, defaults to verified official EXT4 image)"
        type: string
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "*.png"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on GitHub Runner
        run: |
          echo "=== Initial disk space ==="
          df -h /
          echo "Cleaning preinstalled bloat (Android SDK, .NET, GHC, Docker, Boost, vcpkg)..."
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/local/share/boost \
            /usr/share/swift \
            /var/lib/docker
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            xorriso mtools grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin \
            p7zip-full squashfs-tools curl unzip rsync git \
            isolinux syslinux-common

      - name: Build Yoga Book Android ISO
        env:
          LINEAGE_GSI_URL: ${{ inputs.lineage_gsi_url }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-github.sh

      - name: Upload to Fast Mirrors
        run: |
          echo "### 🚀 Fast Download Mirrors" >> "$GITHUB_STEP_SUMMARY"
          echo "Build completed at $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          for iso in dist/*.iso; do
            [ -f "$iso" ] || continue
            filename=$(basename "$iso")
            filesize=$(ls -lh "$iso" | awk '{print $5}')
            echo "Processing $filename ($filesize)..."
            echo "#### $filename ($filesize)" >> "$GITHUB_STEP_SUMMARY"

            # Mirror 1: GoFile (Supports multi-gigabyte ISOs with high bandwidth)
            echo "Uploading $filename to GoFile..."
            gofile_url=$(python3 -c "
import urllib.request, json, subprocess, sys
try:
    req = urllib.request.Request('https://api.gofile.io/servers', headers={'User-Agent': 'Mozilla/5.0'})
    with urllib.request.urlopen(req, timeout=15) as r:
        server = json.loads(r.read().decode())['data']['servers'][0]['name']
    cmd = ['curl', '-sS', '--max-time', '1800', '-F', f'file=@$iso', f'https://{server}.gofile.io/contents/uploadfile']
    res = subprocess.check_output(cmd).decode()
    data = json.loads(res)
    if data.get('status') == 'ok':
        print(data['data']['downloadPage'])
except Exception as e:
    sys.stderr.write(f'GoFile upload error: {e}\n')
" 2>&1 || true)
            if [ -n "$gofile_url" ] && echo "$gofile_url" | grep -q '^https://'; then
              echo "GoFile: $gofile_url"
              echo "- ⚡ **GoFile (High Speed)**: [$gofile_url]($gofile_url)" >> "$GITHUB_STEP_SUMMARY"
            fi

            # Mirror 2: Tmpfiles.org (Supports up to 10GB uploads)
            echo "Uploading $filename to Tmpfiles.org..."
            tmp_url=$(python3 -c "
import subprocess, json, sys
try:
    cmd = ['curl', '-sS', '--max-time', '1800', '-F', f'file=@$iso', 'https://tmpfiles.org/api/v1/upload']
    res = subprocess.check_output(cmd).decode()
    data = json.loads(res)
    url = data['data']['url']
    print(url.replace('tmpfiles.org/', 'tmpfiles.org/dl/'))
except Exception as e:
    sys.stderr.write(f'Tmpfiles upload error: {e}\n')
" 2>&1 || true)
            if [ -n "$tmp_url" ] && echo "$tmp_url" | grep -q '^https://'; then
              echo "Tmpfiles: $tmp_url"
              echo "- ⚡ **Tmpfiles.org (Direct Download)**: [$tmp_url]($tmp_url)" >> "$GITHUB_STEP_SUMMARY"
            fi

            # Mirror 3: transfer.sh (Fallback with short 10s connect timeout)
            echo "Uploading $filename to transfer.sh..."
            url3=$(curl -sS --connect-timeout 10 --max-time 1800 --upload-file "$iso" "https://transfer.sh/$filename" 2>/dev/null || true)
            if [ -n "$url3" ] && echo "$url3" | grep -q '^https://'; then
              echo "transfer.sh link: $url3"
              echo "- ⚡ **transfer.sh**: [$url3]($url3)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          cat "$GITHUB_STEP_SUMMARY"
