name: Build Yoga Book Bass OS 16.9.7

# Builds the Yoga Book (YB1-X91F) kernel from jekhor/yogabook-linux-kernel,
# injects it (kernel + modules) into a Bliss/Bass 16.9.7 x86_64 ISO and
# repacks it as a bootable hybrid ISO.
#
# Free ubuntu-latest runners are 2-core/7GB-RAM: kernel build takes ~45-75 min.
# Keep the repo PUBLIC for unlimited free Linux runner minutes.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      base_iso_variant:
        description: "Bliss 16.9.7 variant (foss | gapps | vanilla)"
        required: false
        default: "foss"
      kernel_type:
        description: "Kernel to use: 'stock' (default Bliss 16 kernel with KernelSU) or 'custom' (7.2 tree)"
        required: false
        default: "stock"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev dwarves ccache \
            zlib1g-dev libcap-dev \
            cpio lz4 xorriso isolinux syslinux-common cmake \
            zstd xz-utils curl ca-certificates
          # isohybrid MBR path differs across distros; normalize it
          if [ -f /usr/lib/syslinux/modules/bios/isohdpfx.bin ]; then
            sudo mkdir -p /usr/lib/ISOLINUX
            sudo cp /usr/lib/syslinux/modules/bios/isohdpfx.bin /usr/lib/ISOLINUX/isohdpfx.bin
          fi

      - name: Locate Bliss 16.9.7 base ISO URL
        id: base
        run: |
          VARIANT="${{ github.event.inputs.base_iso_variant || 'foss' }}"
          RSS="https://sourceforge.net/projects/blissos-x86/rss?path=/Official/BlissOS16"
          XML="$(curl -fsSL --retry 3 "$RSS")"
          URL="$(echo "$XML" | grep -oE '<link>[^<]+\.iso/download</link>' \
                 | sed -E 's#</?link>##g' | grep '16\.9\.7' \
                 | grep -i "$VARIANT" | grep -iv 'surface\|/go/' | head -n1 || true)"
          if [ -z "$URL" ]; then
            URL="$(echo "$XML" | grep -oE '<link>[^<]+\.iso/download</link>' \
                   | sed -E 's#</?link>##g' | grep '16\.9\.7' | head -n1 || true)"
          fi
          [ -n "$URL" ] || { echo "::error::No Bliss 16.9.7 ISO found in RSS"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Base ISO: $URL"

      - name: Download base ISO
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -o base.iso "${{ steps.base.outputs.url }}"
          ls -lh base.iso

      - name: Cache kernel source + objects
        if: ${{ github.event.inputs.kernel_type == 'custom' }}
        uses: actions/cache@v4
        with:
          path: |
            linux
            !linux/out
            linux/out
          key: yb-kernel-${{ hashFiles('kernel/yogabook-android.fragment') }}-${{ github.sha }}
          restore-keys: |
            yb-kernel-${{ hashFiles('kernel/yogabook-android.fragment') }}-
            yb-kernel-

      - name: Cache ccache
        if: ${{ github.event.inputs.kernel_type == 'custom' }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-yb-${{ github.sha }}
          restore-keys: |
            ccache-yb-

      - name: Prepare Yoga Book driver assets (firmware, audio UCM2, halo keyboard)
        run: |
          mkdir -p assets/firmware/intel/sof-tplg assets/firmware/brcm assets/ucm2 assets/halo-keyboard/config assets/scripts
          # static busybox for the initrd installer (fdisk/mkfs/mount)
          curl -fL --retry 3 -o assets/busybox-yb \
            "https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox" \
            || echo "::warning::busybox fetch failed - auto-install will be disabled"
          [ -s assets/busybox-yb ] || rm -f assets/busybox-yb

          # 1. Yoga Book SOF topology for RT5677 sound
          if [ ! -f assets/firmware/intel/sof-tplg/sof-cht-rt5677.tplg ]; then
            curl -fL --retry 3 -o assets/firmware/intel/sof-tplg/sof-cht-rt5677.tplg \
              "https://github.com/Yoga-Book/Yoga-Book-Sound-Open-Firmware/releases/download/yogabook-topology-v1.0.1/sof-cht-rt5677.tplg" \
              || cp yogabook-driver-pack/audio/sof-firmware/sof-cht-rt5677.tplg assets/firmware/intel/sof-tplg/
          fi

          # 2. Broadcom BCM4356 Bluetooth firmware
          if [ ! -f assets/firmware/brcm/BCM4356A2.hcd ]; then
            curl -fL --retry 3 -o assets/firmware/brcm/BCM4356A2.hcd \
              "https://raw.githubusercontent.com/armbian/firmware/master/brcm/BCM4356A2.hcd" \
              || true
          fi

          # 3. ALSA UCM2 audio configurations
          if [ -d yogabook-driver-pack/audio/alsa-ucm/ucm2 ]; then
            cp -r yogabook-driver-pack/audio/alsa-ucm/ucm2/* assets/ucm2/
          fi

          # 4. Compile static Halo Keyboard daemon binary
          echo ">>> Building static halo-keyboard-handler binary"
          mkdir -p build-halo
          cd build-halo
          cmake ../yogabook-driver-pack/halo-keyboard -DCMAKE_BUILD_TYPE=Release
          make halo-keyboard-handler || true
          cd ..
          find build-halo -name halo-keyboard-handler -type f -exec cp {} assets/halo-keyboard/halo-keyboard-handler \;
          [ -f assets/halo-keyboard/halo-keyboard-handler ] && strip assets/halo-keyboard/halo-keyboard-handler || true
          [ -f assets/halo-keyboard/halo-keyboard-handler ] && chmod +x assets/halo-keyboard/halo-keyboard-handler || true
          cp -r yogabook-driver-pack/halo-keyboard/config/* assets/halo-keyboard/config/ 2>/dev/null || true
          cp yogabook-driver-pack/halo-keyboard/config/layouts/YB1-X9x-pc104.csv assets/halo-keyboard/config/layout.csv 2>/dev/null || true

          # 5. Copy startup scripts
          cp scripts/90-yogabook.sh assets/scripts/90-yogabook.sh
          cp scripts/init-yogabook.sh assets/scripts/init-yogabook.sh
          chmod +x assets/scripts/*.sh

      - name: Build Yoga Book kernel
        if: ${{ github.event.inputs.kernel_type == 'custom' }}
        run: |
          set -o pipefail
          bash ./build-kernel.sh 2>&1 | tee kernel-build.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel-build.log
          if-no-files-found: ignore
        env:
          KERNEL_REF: master
          JOBS: "2"

      - name: Repack ISO with auto-installer
        run: |
          KERNEL_ARG="stock"
          MODULES_ARG="stock"
          KREL_ARG=""
          if [ "${{ github.event.inputs.kernel_type }}" = "custom" ] && [ -f artifacts/KREL ]; then
            KREL="$(cat artifacts/KREL)"
            KERNEL_ARG="artifacts/bzImage-$KREL"
            MODULES_ARG="artifacts/modules-$KREL.tar.gz"
            KREL_ARG="artifacts/KREL"
          fi
          bash ./repack-iso.sh base.iso "$KERNEL_ARG" "$MODULES_ARG" \
            "YogaBook-BassOS-16.9.7-autoinstall-$(date +%Y%m%d)-x86_64.iso" \
            assets $KREL_ARG

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-bass-iso
          path: |
            YogaBook-BassOS-*.iso
            artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach ISO to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO="$(ls YogaBook-BassOS-*.iso | head -n1)"
          if [ "$(stat -c%s "$ISO")" -lt 2000000000 ]; then
            gh release create "yogabook-$(date +%Y%m%d-%H%M)" "$ISO" \
              --title "Yoga Book Bass OS 16.9.7" \
              --notes "Bliss/Bass 16.9.7 with Yoga Book (YB1-X91F) kernel from jekhor/yogabook-linux-kernel + Android binder config. Flash to USB and boot holding Volume Up." \
              || gh release upload "$(gh release list -L1 --json tagName -q '.[0].tagName')" "$ISO" --clobber
          else
            echo "ISO >2 GiB release limit; keeping it as workflow artifact only"
          fi
