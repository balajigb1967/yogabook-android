name: Build Yoga Book Kernel 6.18

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches-kernel-6.18/**'
      - 'device/yogabook/**'
      - '.github/workflows/build-kernel-618.yml'

jobs:
  build-kernel:
    name: Build Patched Kernel 6.18 (Zenith + Yoga Book RT5677)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout yogabook-android
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            git curl rsync

      - name: Clone android-generic/kernel-zenith (6.18_android-x86)
        run: |
          git clone --depth 1 --branch 6.18_android-x86 https://github.com/android-generic/kernel-zenith.git $HOME/kernel-zenith
          echo "Cloned kernel-zenith commit:"
          git -C $HOME/kernel-zenith log -1 --oneline

      - name: Integrate KernelSU
        run: |
          cd $HOME/kernel-zenith
          echo "=== Integrating KernelSU into Kernel 6.18 Tree ==="
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Apply Yoga Book Hardware Patches
        run: |
          cd $HOME/kernel-zenith
          echo "=== Applying Yoga Book 6.18 Hardware Backport Patches ==="
          for p in $(ls -1 "${GITHUB_WORKSPACE}"/patches-kernel-6.18/*.patch | sort); do
            echo "[*] Applying $(basename "$p")..."
            if git apply --check "$p" 2>/dev/null; then
              git apply --whitespace=nowarn "$p"
              echo "  [✓] Applied $(basename "$p") cleanly"
            else
              echo "  [~] Applying with 3-way / patch fallback..."
              git apply --3way --whitespace=nowarn "$p" || patch -p1 -N < "$p" || true
            fi
          done
          git status -s

      - name: Configure Kernel with Yoga Book Fragment
        run: |
          cd $HOME/kernel-zenith
          make x86_64_defconfig
          # Merge Android x86 / Yoga Book config additions
          if [ -f "${GITHUB_WORKSPACE}/device/yogabook/YOGABOOK_x86_64/configs/kernel/yogabook.config" ]; then
            bash scripts/kconfig/merge_config.sh -m .config "${GITHUB_WORKSPACE}/device/yogabook/YOGABOOK_x86_64/configs/kernel/yogabook.config"
          fi
          # Enable KernelSU and Yoga Book hardware symbols
          ./scripts/config --enable KSU \
                           --enable KSU_DEBUG \
                           --enable SND_SOC_INTEL_CHT_RT5677_MACH \
                           --enable SND_SOC_RT5677 \
                           --enable SND_SOC_RT5677_SPI \
                           --enable INPUT_DRV260X \
                           --enable INTEL_CHT_MODEM \
                           --enable VIDEO_ATOMISP \
                           --enable VIDEO_WV517S \
                           --disable DEBUG_INFO \
                           --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
                           --disable DEBUG_INFO_DWARF4 \
                           --disable DEBUG_INFO_DWARF5 \
                           --disable DEBUG_INFO_BTF \
                           --enable DEBUG_INFO_NONE \
                           --set-val WERROR n
          make olddefconfig
          echo "Verifying RT5677, DRV260X, and KSU config symbols:"
          grep -E 'RT5677|TS3A227E|DRV260X|KSU|ATOMISP|CHT_MODEM' .config || true

      - name: Compile Kernel and Modules
        run: |
          cd $HOME/kernel-zenith
          JOBS=$(nproc)
          echo "Building kernel with $JOBS parallel jobs..."
          make -j"$JOBS" bzImage modules

      - name: Stage Kernel & Modules Package
        run: |
          cd $HOME/kernel-zenith
          mkdir -p $HOME/staging/modules
          cp -v arch/x86/boot/bzImage $HOME/staging/kernel
          make INSTALL_MOD_PATH=$HOME/staging/modules_raw INSTALL_MOD_STRIP=1 modules_install
          
          # Extract the exact kernel release string
          KVER=$(ls $HOME/staging/modules_raw/lib/modules/)
          echo "Built kernel version: $KVER"
          echo "KVER=$KVER" >> $GITHUB_ENV
          
          # Move modules into a clean archive
          mkdir -p $HOME/staging/output
          cp -v $HOME/staging/kernel $HOME/staging/output/kernel
          tar -C $HOME/staging/modules_raw/lib/modules -czf $HOME/staging/output/modules-${KVER}.tar.gz ${KVER}
          
          # List generated files
          ls -la $HOME/staging/output/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-kernel-6.18-${{ env.KVER }}
          path: /home/runner/staging/output/*
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-6.18-${{ env.KVER }}
          name: "Yoga Book Kernel 6.18 (${{ env.KVER }}) - RT5677 Audio, Haptics & KernelSU"
          body: |
            ## Yoga Book Kernel 6.18 with Audio, Haptics, Camera, LTE & KernelSU
            - **Base**: `android-generic/kernel-zenith` branch `6.18_android-x86`
            - **KernelSU**: Integrated for root and driver module hooking
            - **Audio Codec**: Realtek RT5677 + Intel SST DSP (`snd-soc-sst-cht-rt5677`)
            - **Headset / Jack Detection**: TS3A227E detector
            - **Haptics**: Dual TI DRV2604 motors with clean ACPI / I2C binding
            - **Camera**: AtomISP raw Bayer + WV517S lens actuator
            - **LTE / SSIC**: Intel XMM7260 power driver + xHCI SSIC state restore
            - **Power & Charging**: BQ25890 fast charging + power supply core fix
          files: /home/runner/staging/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
